<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #f2f2f0;
    }

    .bar {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      color: #1f2933;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <model-viewer
    src="output_model/pbr/mesh_textured_pbr.glb"
    camera-controls
    auto-rotate
    shadow-intensity="0.8"
    exposure="1"
    environment-image="neutral"
    ar>
  </model-viewer>
  <div class="bar">拖动旋转，滚轮缩放，右键平移</div>
</body>
</html>
